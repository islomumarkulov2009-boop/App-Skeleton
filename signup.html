<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Jobs 4 Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container nav">
      <h1 class="logo"><a href="index.html">Jobs 4 Us</a></h1>
      <a class="small-button" href="index.html">Home</a>
    </div>
  </header>

  <main class="section container">
    <div class="hero-card">
      <p class="label">Create a profile</p>
      <h2>Join Jobs 4 Us</h2>

      <form>
        <p>
          <label>First Name</label><br>
          <input type="text" style="width:100%; padding:12px; margin-top:6px;">
        </p>

        <p>
          <label>Email</label><br>
          <input type="email" style="width:100%; padding:12px; margin-top:6px;">
        </p>

        <p>
          <label>Age</label><br>
          <select style="width:100%; padding:12px; margin-top:6px;">
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
          </select>
        </p>

        <button class="small-button" type="submit" style="border:none;">
          Create Profile
        </button>
      </form>
    </div>
  </main>

</body>
</html>
